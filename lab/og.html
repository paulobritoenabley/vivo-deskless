<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>og</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: "Trebuchet MS", sans-serif; }
  .cena { position: absolute; inset: 0; }
  .cena svg { width: 100%; height: 100%; }
  .cartao { position: absolute; left: 56px; top: 64px; width: 520px; background: #FCF9FD; color: #660099; border-radius: 8px;
    padding: 34px 38px 32px; rotate: -1.2deg; box-shadow: 0 4px 0 rgba(56,0,84,.1), 0 30px 60px -10px rgba(20,0,35,.5); }
  .cartao::after { content: ""; position: absolute; left: 26px; top: -16px; width: 120px; height: 34px; rotate: -4deg; background: rgba(255,150,178,.75); }
  h1 { margin: 0; font-size: 54px; line-height: 1.04; font-weight: 700; }
  mark { background: #FF96B2; color: #380054; padding: 0 6px; border-radius: 3px; }
  p { margin: 18px 0 0; font-size: 24px; line-height: 1.35; color: #380054; }
  .logo { position: absolute; right: 48px; bottom: 40px; background: #660099; border-radius: 8px; padding: 14px 18px; }
  .logo img { display: block; width: 120px; height: auto; }
</style></head>
<body>
<div class="cena" id="cena"></div>
<div class="cartao">
  <h1>Treine quem não tem <mark>computador</mark>.</h1>
  <p>O treinamento da linha de frente no celular, com a Plataforma Vivo Empresas.</p>
</div>
<div class="logo"><img src="../assets/marca/vivo-logo-branco.svg" alt=""></div>
<script src="../cenas.js"></script>
<script>
  // Estoque com o repositor acenando, enquadrado à direita para o cartão caber à esquerda.
  var svg = Cenas.plana('estoque', 'og', { inteira: true, acenando: true })
    .replace('viewBox="0 0 1600 1000"', 'viewBox="230 150 1360 714"');
  document.getElementById('cena').innerHTML = svg;
</script>
</body></html>
